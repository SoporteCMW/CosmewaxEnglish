<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso - Web PRL</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-hero" aria-label="Web PRL">
            <img class="login-logo" src="assets/img/cosmewax-logo.svg" alt="Cosmewax">
            <div>
                <p class="eyebrow">Prevencion de riesgos laborales</p>
                <h1>Web PRL</h1>
                <p>Consulta interna de formacion, aprobaciones y documentacion asociada.</p>
            </div>
        </section>

        <section class="login-card">
            <p class="eyebrow">Acceso privado</p>
            <h2>Iniciar sesion</h2>
            <p class="muted">Usa tu cuenta autorizada para entrar al panel.</p>

            <form method="post" class="login-form">
                <label>
                    Usuario
                    <input type="text" name="username" autocomplete="username" required autofocus>
                </label>
                <label>
                    Contrasena
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
